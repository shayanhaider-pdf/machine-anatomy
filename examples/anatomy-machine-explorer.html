(()=>{
 const root=document.getElementById('anatomy-explorer');if(!root)return;
 const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];
 const stage=q('.ae-canvas'),world=q('.ae-world'),cycle=q('[aria-label="Cycle progress"]'),orbitInput=q('[aria-label="View angle"]'),partInput=q('[aria-label="Inspect a part"]');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 let subject='crank',phase=0,orbit=0,zoom=1,speed=1,playing=!reduced.matches,cutaway=true,explode=0,targetExplode=0,selected='',controller=null,frame=0,last=0,visible=true,lastPhase='';
 const boundOrbit=x=>Math.max(subject==='press'?0:-180,Math.min(subject==='press'?20:180,x));
 function say(text){q('[data-announce]').textContent=text;}
 function mount(){
  controller?.destroy();world.innerHTML=SCENES[subject].svg;
  world.querySelector('svg').setAttribute('role','img');world.querySelector('svg').removeAttribute('aria-hidden');
  world.querySelector('svg').setAttribute('aria-label',subject==='crank'?'Isometric crank-slider with flywheel, crank pin, connecting rod and guided crosshead.':'One tablet-press tooling station with upper and lower punches, a die cavity and take-off blade.');
  controller=TURN.mount(world,SCENES[subject].data,{onHold:()=>{playing=false;}});
  q('[data-title]').textContent=subject==='crank'?'Crank-slider':'Tablet press station';
  q('[data-part-count]').textContent=SCENES[subject].parts.length;
  q('[data-note]').textContent=subject==='crank'?'Illustrative dimensions. Rigid-link kinematics; no load or friction simulation.':'Simplified tooling station. Inspection sweep 20°. Drive and feed omitted; powder shown as schematic bands.';
  orbitInput.min=subject==='press'?'0':'-180';orbitInput.max=subject==='press'?'20':'180';
  const interesting=subject==='crank'?['Flywheel','Crank pin','Connecting rod','Crosshead','Guide rail -17','Drive enclosure front']:['Upper punch','Lower punch','Die sector 0','Upper punch holder','Take-off blade','Powder band 5'];
  partInput.replaceChildren(new Option('Choose a part',''),...interesting.map(n=>new Option(n.startsWith('Die sector')?'Die':n.startsWith('Powder band')?'Powder / tablet':n,n)));
  selected='';q('[data-detail]').textContent='Select a part to see its role.';lastPhase='';draw();run();
 }
 function draw(){
  controller.set(valuesFor[subject](phase,orbit,explode));
  world.style.transform=`scale(${zoom})`;
  for(const el of world.querySelectorAll('[data-name]')){
   const name=el.dataset.name;
   const frontDie=name.startsWith('Die sector ')&&Number(name.split(' ').pop())<8;
   const cover=name.startsWith('Drive enclosure');
   let hide=(subject==='crank'&&cutaway&&cover)||(subject==='press'&&cutaway&&frontDie);
   if(subject==='press'&&name.startsWith('Powder band'))hide ||= !pressAt(phase).material[Number(name.split(' ').pop())].visible;
   el.style.display=hide?'none':'';
   if(selected && (name===selected||(selected.startsWith('Die sector')&&name.startsWith('Die sector'))||(selected.startsWith('Powder band')&&name.startsWith('Powder band'))))el.setAttribute('data-selected','');else el.removeAttribute('data-selected');
  }
  if(subject==='crank'){
   const s=crankAt(phase);
   q('[data-phase]').textContent='Rotation to reciprocation';
   q('[data-readout-a]').textContent=`Crank ${s.angle.toFixed(0)}°`;
   q('[data-readout-b]').textContent=`Travel ${s.travel.toFixed(1)} mm`;
   q('[data-readout-c]').textContent=`Rod ${Math.hypot(s.slider-s.pin[0],s.pin[1]).toFixed(1)} mm`;
  }else{
   const s=pressAt(phase);q('[data-phase]').textContent=s.phaseName;
   q('[data-readout-a]').textContent=`Punch gap ${s.gap.toFixed(1)} mm`;
   q('[data-readout-b]').textContent=`Fill depth ${s.cavityDepth.toFixed(1)} mm`;
   q('[data-readout-c]').textContent=`Cycle ${(phase*100).toFixed(0)}%`;
   if(lastPhase!==s.phaseName){lastPhase=s.phaseName;say(s.phaseName);}
  }
  cycle.value=Math.round(phase*1000);q('[data-progress]').textContent=`${Math.round(phase*100)}%`;
  orbitInput.value=orbit;q('[data-view]').textContent=`${Math.round(orbit)}°`;
  q('.ae-play').textContent=playing?'Pause':'Play';q('.ae-play').setAttribute('aria-label',playing?'Pause animation':'Play animation');q('.ae-play').setAttribute('aria-pressed',String(playing));
  q('[data-action=cutaway]').setAttribute('aria-pressed',String(cutaway));q('[data-action=explode]').setAttribute('aria-pressed',String(targetExplode===1));
 }
 function tick(now){
  frame=0;const dt=last?Math.min((now-last)/1000,1/30):0;last=now;
  if(playing&&visible&&!document.hidden)phase=(phase+dt*speed/(subject==='crank'?9:16))%1;
  if(reduced.matches)explode=targetExplode;else if(Math.abs(explode-targetExplode)>.001)explode+=(targetExplode-explode)*(1-Math.exp(-dt/0.2));else explode=targetExplode;
  draw();if(visible&&!document.hidden&&(playing||explode!==targetExplode))frame=requestAnimationFrame(tick);
 }
 function run(){if(!frame&&visible&&!document.hidden){last=0;frame=requestAnimationFrame(tick);}}
 function stop(){playing=false;}
 function togglePlay(){playing=!playing;draw();run();}
 function action(name){
  if(name==='cutaway'){cutaway=!cutaway;say(cutaway?'Cutaway enabled':'Housing assembled');}
  if(name==='explode'){targetExplode=1-targetExplode;stop();say(targetExplode?'Assemblies separated':'Assemblies closing');}
  if(name==='zoom-in')zoom=Math.min(2.5,zoom+.2);
  if(name==='zoom-out')zoom=Math.max(.7,zoom-.2);
  if(name==='reset'){orbit=0;zoom=1;targetExplode=0;selected='';partInput.value='';q('[data-detail]').textContent='Select a part to see its role.';}
  if(name==='theme'){const dark=root.dataset.theme==='light';root.dataset.theme=dark?'dark':'light';q('[data-action=theme]').textContent=dark?'Light':'Dark';q('[data-action=theme]').setAttribute('aria-label',dark?'Switch to light appearance':'Switch to dark appearance');}
  draw();run();
 }
 q('[aria-label=Mechanism]').addEventListener('change',e=>{subject=e.target.value;phase=0;orbit=0;zoom=1;explode=targetExplode=0;mount();});
 q('.ae-play').addEventListener('click',togglePlay);
 cycle.addEventListener('input',()=>{stop();phase=Number(cycle.value)/1000;draw();});
 orbitInput.addEventListener('input',()=>{orbit=boundOrbit(Number(orbitInput.value));draw();});
 q('[aria-label="Playback speed"]').addEventListener('change',e=>{speed=Number(e.target.value);});
 qa('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));
 partInput.addEventListener('change',()=>{
  selected=partInput.value;const d=SCENES[subject].descriptions;
  const key=selected.startsWith('Die sector')?'Die sector':selected.startsWith('Powder band')?'Powder band':selected;
  q('[data-detail]').textContent=d[key]??(selected.startsWith('Guide rail')?'Supports and constrains the crosshead to straight-line travel.':'Select a part to see its role.');draw();
 });
 let drag=null;
 stage.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&e.isPrimary===false)return;drag={x:e.clientX,orbit};stage.setPointerCapture(e.pointerId);});
 stage.addEventListener('pointermove',e=>{if(!drag)return;orbit=subject==='press'?boundOrbit(drag.orbit+(e.clientX-drag.x)*.15):((drag.orbit+(e.clientX-drag.x)*.55+540)%360)-180;draw();});
 for(const event of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(event,()=>{drag=null;});
 stage.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.7,Math.min(2.5,zoom-e.deltaY*.002));draw();},{passive:false});
 stage.addEventListener('keydown',e=>{
  if(e.target!==stage)return;
  if([' ','Enter','ArrowLeft','ArrowRight','+','-','=','c','C','e','E','Home','Escape'].includes(e.key))e.preventDefault();
  if(e.key===' '||e.key==='Enter')togglePlay();
  if(e.key==='ArrowLeft'){orbit=boundOrbit(orbit-5);draw();}
  if(e.key==='ArrowRight'){orbit=boundOrbit(orbit+5);draw();}
  if(e.key==='+'||e.key==='=')action('zoom-in');if(e.key==='-')action('zoom-out');
  if(e.key.toLowerCase()==='c')action('cutaway');if(e.key.toLowerCase()==='e')action('explode');if(e.key==='Home')action('reset');if(e.key==='Escape'){stop();draw();}
 });
 new IntersectionObserver(entries=>{visible=entries[entries.length-1].isIntersecting;if(visible)run();else{cancelAnimationFrame(frame);frame=0;}},{rootMargin:'100px'}).observe(stage);
 document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0;}else run();});
 reduced.addEventListener('change',()=>{if(reduced.matches)stop();draw();run();});
 window.anatomyExplorer={
  get state(){return {subject,phase,orbit,zoom,playing,cutaway,explode,speed,model:subject==='crank'?crankAt(phase):pressAt(phase),stats:controller.stats()};},
  set(v){if(v.subject&&v.subject!==subject){subject=v.subject;q('[aria-label=Mechanism]').value=subject;mount();}if(v.phase!==undefined)phase=clamp01(v.phase);if(v.orbit!==undefined)orbit=boundOrbit(v.orbit);if(v.explode!==undefined)explode=targetExplode=v.explode;if(v.playing!==undefined)playing=v.playing;draw();run();},
  scene:()=>controller.scene()
 };
 mount();
})();
