*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% -30%,#173d53 0%,var(--bg) 62%);min-height:100vh}.shell{max-width:1220px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:8px}h1{font-size:clamp(24px,3vw,39px);margin:0;letter-spacing:-.035em}.subtitle{color:var(--muted);font-size:14px;margin:10px 0 20px;max-width:760px;line-height:1.55}.back{color:#cbddf0;border:1px solid var(--line);border-radius:10px;padding:10px 13px;text-decoration:none;font-size:13px}.back:hover{border-color:var(--accent)}.main{border:1px solid #284458;border-radius:19px;background:linear-gradient(180deg,#122438,#091727);overflow:hidden;box-shadow:0 16px 45px #0004}.stage{position:relative}canvas{display:block;width:100%;height:auto;aspect-ratio:960/540}.overlay{position:absolute;left:19px;top:17px;display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:11px;border-radius:7px;background:#07121ecb;border:1px solid #37516b;color:#b9d8e8;padding:7px 10px;letter-spacing:.05em}.status{color:#90f6c0}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 20px;background:#0c1929;border-top:1px solid #253d51}button{background:#3ebdb9;color:#06202b;border:0;border-radius:9px;padding:10px 15px;font-size:13px;font-weight:750;cursor:pointer}button.secondary{background:#1d3448;color:#e5f4ff;border:1px solid #355169}button:hover{filter:brightness(1.12)}label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}input[type=range]{accent-color:var(--accent);width:100px}input[type=checkbox]{accent-color:var(--accent)}.phase{font-size:13px;font-weight:700;color:#e0f4ff;margin-left:auto}.info{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.panel{background:#101e2d;border:1px solid #284058;border-radius:13px;padding:19px}.panel h2{font-size:14px;margin:0 0 10px}.panel p{font-size:13px;line-height:1.6;color:var(--muted);margin:0}.timeline{display:flex;gap:4px;margin-top:14px}.phasebutton{flex:1;border:1px solid #2d485e;color:#99bed0;background:#102338;font-size:11px;padding:9px 4px;border-radius:6px;min-width:0}.phasebutton.active{background:#285d62;color:#dcffff;border-color:#5bd0cc}.small{font-size:12px;color:#8298af;margin-top:17px}.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}@media(max-width:740px){.shell{padding:11px}.info{grid-template-columns:1fr}.controls{gap:10px;padding:13px}.phase{width:100%;margin:0}.overlay{left:10px;top:9px}.chip{font-size:9px;padding:5px}.phasebutton{font-size:9px}.panel{padding:14px}button{padding:9px 11px}}

 granulator:{title:'High-shear granulator',subtitle:'Powder mixing and wet granulation inside a closed processing bowl. Inspect impeller motion, chopper action and binder addition.',phases:['Charge','Dry mix','Binder spray','Wet granulation','Discharge'],descs:['Powder enters the mixing vessel through the upper charge port.','A high-speed bottom impeller distributes the dry materials.','Binder liquid is introduced through a nozzle to promote agglomeration.','The impeller and side chopper generate and control granule formation.','Finished wet granules leave through the side discharge opening.'],detail:'Watch the impeller rotate near the bowl floor while the high-speed side chopper breaks oversized agglomerates. Binder droplets appear during the spray phase. Granules are drawn with simplified motion.'},
 dryer:{title:'Fluid-bed dryer',subtitle:'Drying of wet pharmaceutical granules by suspending them in upward heated process air. See airflow, particle fluidization and exhaust.',phases:['Preheat','Charge','Fluidize','Dry','Discharge'],descs:['Heated, filtered process air conditions the vessel.','Wet granules are introduced into the product container.','Upward air lifts and separates the moving granules.','Heat and mass transfer remove moisture; air exits through filtration.','Dried granules are discharged from the product chamber.'],detail:'Watch air rise through the distributor plate and granules become suspended. The top filter region illustrates exhaust filtration. Flow and particle paths are schematic, not a CFD simulation.'},
 blender:{title:'IBC bin blender',subtitle:'Low-shear tumble blending of pharmaceutical powders in a sealed intermediate bulk container (IBC).',phases:['Fill','Dock','Rotate','Blend','Undock'],descs:['Components are added to the sealed IBC.','The filled bin is clamped to the rotating support frame.','The motor drives end-over-end bin rotation.','Repeated tumbles redistribute the bulk powder and improve mixing.','Rotation stops and the bin is removed for downstream processing.'],detail:'Watch the entire IBC rotate end-over-end, rather than an internal agitator. Powder dots represent redistribution with each revolution. Rotation and residence time are adjustable with the playback-speed slider.'},

function poly(points,fill,stroke=null){g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=3;g.stroke()}}
